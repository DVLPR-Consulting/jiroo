services:
  db:
    image: postgres:17
    container_name: jiroo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jiroo
      POSTGRES_PASSWORD: jiroo
      POSTGRES_DB: jiroo
    ports:
      - "5433:5432"
    volumes:
      - jiroo-pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiroo -d jiroo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jiroo-pgdata:
